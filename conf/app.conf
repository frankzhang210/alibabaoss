appname = alibabaoss
httpport = 8080
runmode = dev
autorender = false
copyrequestbody = true
EnableDocs = true

[mysql]
url = <account>@<server>:<pwd>@tcp(<server>.mysql.database.azure.com:3306)/<database>?charset=utf8

[OSSEndPoint]
Public = oss-us-west-1.aliyuncs.com
ClassicFromECS = oss-us-west-1-internal.aliyuncs.com
VPCFromECS = oss-us-west-1-internal.aliyuncs.com
AccessKeyId = <your id>
AccessKeySecret = <secret>
Bucket = <your bucket name>